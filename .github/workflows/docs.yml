name: Docs

# Build the Starlight site in website/ on every pull request that touches it. Deploy it to
# GitHub Pages from main, and only once the repo is public, so the site never publishes
# what the repo still keeps private. The repo's Pages source must be set to
# "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  # Never cancel a Pages deploy halfway.
  cancel-in-progress: false

jobs:
  build:
    name: Build the docs site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Bun and just at the versions mise.toml pins.
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-site-${{ runner.os }}-${{ hashFiles('website/bun.lock') }}
      - run: just site
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
